services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: taskflow
    ports:
      - '5432:5432'
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskflow-db-data:
